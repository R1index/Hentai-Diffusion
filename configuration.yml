              safe_set(43, "unet_name", "anima_preview.safetensors")
              safe_set(41, "vae_name", "qwen_image_vae.safetensors")
              safe_set(42, "clip_name", "qwen_3_06b_base.safetensors")
              safe_set(18, "seed", random.randint(0, 2**32 - 1))

      - name: config
        description: Configure generation parameters
        code: |
          def config(workflowjson, *args):
              import random

              def get(node_id):
                  return workflowjson.get(str(node_id))

              def safe_set(node_id, key, value):
                  n = get(node_id)
                  if n and "inputs" in n:
                      n["inputs"][key] = value

              params = {}
              for arg in args:
                  if "=" in arg:
                      key, value = arg.split("=", 1)
                      params[key.strip()] = value.strip()

              if "seed" in params:
                  safe_set(18, "seed", int(params["seed"]))
              else:
                  safe_set(18, "seed", random.randint(0, 2**32 - 1))

              if "model" in params:
                  model_name = params["model"]
